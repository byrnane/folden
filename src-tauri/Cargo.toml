[package]
name = "app"
version = "0.4.12"
description = "Local-first desktop Markdown and text editor."
authors = ["byrnane"]
license = "UNLICENSED"
repository = "git@github.com:byrnane/folden.git"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
rfd = "0.17.2"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
trash = "5.2.6"
notify = "8.2.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
