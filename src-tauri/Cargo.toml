[package]
name = "app"
version = "0.12.0"
description = "Desktop Markdown and text editor with visual and source modes."
authors = ["byrnane"]
license-file = "../LICENSE.md"
publish = false
repository = "https://github.com/byrnane/folden.git"
edition = "2021"
rust-version = "1.96"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
rfd = "0.17.2"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
trash = "5.2.6"
notify = "8.2.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"
