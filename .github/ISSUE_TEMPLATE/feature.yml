name: Feature request / Предложение
description: Explain a concrete editing workflow that Folden could improve.
body:
  - type: textarea
    id: workflow
    attributes:
      label: Workflow and problem / Сценарий и проблема
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Proposed behavior / Предлагаемое поведение
    validations:
      required: true
