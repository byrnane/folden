name: Feature request / Предложение
description: Describe what you want to do and how Folden could help.
body:
  - type: textarea
    id: workflow
    attributes:
      label: What you want to do and what gets in the way / Что хотите сделать и что мешает
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: What would help / Что помогло бы
    validations:
      required: true
