name: Bug report / Ошибка
description: Describe a bug using a small example without personal data.
body:
  - type: markdown
    attributes:
      value: |
        Make a small example for this report. Leave out private documents, recovery or session files, credentials and personal paths. For vulnerabilities, use the private reporting form linked in the [security policy](https://github.com/byrnane/folden/security/policy).

        Подготовьте небольшой пример специально для сообщения. Уберите личные документы, файлы восстановления и сессии, учётные данные и персональные пути. Об уязвимостях сообщайте через приватную форму из [политики безопасности](https://github.com/byrnane/folden/security/policy).
  - type: input
    id: version
    attributes:
      label: Folden version and operating system / Версия и ОС
      placeholder: 0.12.0, Windows 11 x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce / Как повторить ошибку
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What you expected and what happened / Что ожидали и что произошло
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example Markdown or screenshot without personal data / Markdown или снимок без личных данных
