name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and Windows browser tests
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up Rust
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
      - run: npm ci
      - run: npm run quality
      - run: npm run test:release
      - run: npm run privacy:check
      - run: npm run licenses:generate
      - run: npm run licenses:check
      - run: npm run test:coverage
        if: github.event_name == 'workflow_dispatch'
      - run: npx playwright install chromium
      - run: npm run test:e2e:smoke
        if: github.event_name != 'workflow_dispatch'
      - run: npm run test:e2e
        if: github.event_name == 'workflow_dispatch'
      - run: npm run vue:build
      - run: npm run test:performance
        if: github.event_name == 'workflow_dispatch'

  # Fixed names preserve required checks when automatic runs skip native jobs.
  native-windows:
    name: Native x86_64-pc-windows-msvc
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      FOLDEN_NATIVE_TARGET: x86_64-pc-windows-msvc
    steps: &native-steps
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up Rust
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy --target ${{ env.FOLDEN_NATIVE_TARGET }}
      - run: npm ci
      - run: npm run vue:build
      - name: Rust format
        if: runner.os == 'Windows'
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets --target ${{ env.FOLDEN_NATIVE_TARGET }} -- -D warnings
      - name: Native tests
        working-directory: src-tauri
        run: cargo test --locked --target ${{ env.FOLDEN_NATIVE_TARGET }}

  native-macos-intel:
    name: Native x86_64-apple-darwin
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      FOLDEN_NATIVE_TARGET: x86_64-apple-darwin
    steps: *native-steps

  native-macos-arm:
    name: Native aarch64-apple-darwin
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      FOLDEN_NATIVE_TARGET: aarch64-apple-darwin
    steps: *native-steps
