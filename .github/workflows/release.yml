name: Draft beta release

on:
  push:
    branches: ['release/beta-*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.12.0)
        required: true
        default: v0.12.0
        type: string
      create_draft:
        description: Create a draft prerelease after all package checks pass
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate candidate or exact tag and version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_CANDIDATE: ${{ github.event_name == 'push' }}
        run: node scripts/release-tag.mjs
      - name: Set up Rust
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
      - run: npm ci
      - run: npm run quality
      - run: npm run test:release
      - run: npm run privacy:check
      - run: npm run licenses:generate
      - run: npm run licenses:check
      - run: npm run test:coverage
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - run: npm run vue:build
      - run: npm run test:performance

  build:
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.quality.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up Rust
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy --target ${{ matrix.target }}
      - run: npm ci
      - run: npm run version:check
      - run: npm run vue:build
      - name: Native gates
        shell: bash
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
          cargo test --locked --target ${{ matrix.target }}
      - name: Build only supported packages
        run: npm run release:build -- --target ${{ matrix.target }}
      - name: Inspect final package payload and generate checksums
        run: npm run release:verify -- --target ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: folden-${{ matrix.target }}
          path: build/release/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14

  draft:
    if: github.event_name == 'workflow_dispatch' && inputs.create_draft
    needs: [quality, build]
    runs-on: ubuntu-22.04
    environment: release-draft
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.quality.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: build/release
          pattern: folden-*
      - name: Create a draft prerelease for owner review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ needs.quality.outputs.commit }}
        run: node scripts/release-draft.mjs
